info:
  name: 03_regresion_bloqueo_sql_multisentencia
  type: http
  seq: 3
http:
  method: POST
  url: "{{baseUrl}}/api/v1/reportes/ejecutar-raw"
  headers:
    - name: Content-Type
      value: application/json
      enabled: true
    - name: Authorization
      value: "Bearer {{authToken}}"
      enabled: true
    - name: X-Tenant-Slug
      value: "{{tenantSlug}}"
      enabled: true
  body:
    type: json
    data: '{"querySql":"SELECT * FROM \"Tienda\"; DELETE FROM \"user\";"}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  scripts:
    - type: tests
      code: |
        test("Inyección SQL multisentencia separada por punto y coma es rechazada", function() {
          expect(res.status).to.equal(400);
          expect(res.body.message).to.include("No se permiten múltiples sentencias SQL");
        });
