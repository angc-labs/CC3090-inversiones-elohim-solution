info:
  name: 04_carrito_consulta
  type: http
  seq: 4
http:
  method: GET
  url: "{{baseUrl}}/api/v1/carrito"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
      enabled: true
    - name: X-Tenant-Slug
      value: "{{tenantSlug}}"
      enabled: true
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |
        test("Consulta de carrito confirma persistencia e integridad de datos", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.greaterThan(0);
        });
