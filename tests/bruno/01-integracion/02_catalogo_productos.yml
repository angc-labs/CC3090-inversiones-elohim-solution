info:
  name: 02_catalogo_productos
  type: http
  seq: 2
http:
  method: GET
  url: "{{baseUrl}}/api/v1/productos"
  headers:
    - name: X-Tenant-Slug
      value: "{{tenantSlug}}"
      enabled: true
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: after-response
      code: |
        const body = res.getBody();
        if (Array.isArray(body) && body.length > 0) {
          bru.setVar("testProductoId", body[0].id);
          bru.setVar("testProductoNombre", body[0].nombre);
        }
    - type: tests
      code: |
        test("Consulta de catálogo de productos recupera items desde PostgreSQL", function() {
          expect(res.status).to.equal(200);
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.greaterThan(0);
        });
