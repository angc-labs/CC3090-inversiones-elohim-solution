info:
  name: 03_carrito_persistencia
  type: http
  seq: 3
http:
  method: POST
  url: "{{baseUrl}}/api/v1/carrito/articulos"
  headers:
    - name: Content-Type
      value: application/json
      enabled: true
    - name: Authorization
      value: "Bearer {{authToken}}"
      enabled: true
    - name: X-Tenant-Slug
      value: "{{tenantSlug}}"
      enabled: true
  body:
    type: json
    data: '{"productoId":"{{testProductoId}}","cantidad":2}'
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
  scripts:
    - type: after-response
      code: |
        const body = res.getBody();
        if (body && body.id) {
          bru.setVar("cartItemId", body.id);
        }
    - type: tests
      code: |
        test("Inserción y cálculo de subtotal en tabla CarritoElemento", function() {
          expect(res.status).to.equal(201);
          expect(res.body.id).to.be.a("string");
          expect(res.body.productoId).to.equal(bru.getVar("testProductoId"));
          expect(res.body.cantidad).to.be.at.least(2);
          expect(res.body.subtotal).to.be.greaterThan(0);
        });
