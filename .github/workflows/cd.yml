name: Stack CD

on:
  workflow_run:
    workflows: ['Stack CI']
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip root artifact publish
        run: |
          echo "The root repository does not build the stack images."
          echo "Backend, frontend, and docs publish their own Docker images from their respective repositories."
          echo "This stack workflow is kept as a compatibility check only."
          echo "Deployment is handled by the submodule repositories."
