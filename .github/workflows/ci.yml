name: Stack CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: '8.30.1'
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfL "$base/$archive" -o "$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep " $archive\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan git history for secrets
        run: >-
          gitleaks git .
          --redact
          --verbose
          --exit-code 1
          --report-format json
          --report-path "${RUNNER_TEMP}/gitleaks-report.json"

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report.json
          if-no-files-found: ignore

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ github.workspace }}/stack
    steps:
      - name: Checkout complete application
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: stack
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run .NET test suite
        run: >-
          dotnet test backend/tests/ElohimShop.Tests/ElohimShop.Tests.csproj
          --configuration Release
          --logger "trx;LogFileName=backend.trx"
          --collect:"XPlat Code Coverage"
          --results-directory "${RUNNER_TEMP}/test-results"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

      - name: Prepare backend-only CI compose
        run: |
          cd "$GITHUB_WORKSPACE/stack"
          cp .env.example .env
          cat > compose.backend.ci.yml <<'YAML'
          services:
            db:
              image: postgres:16-alpine
              restart: unless-stopped
              environment:
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: postgres
                POSTGRES_DB: dmhub
              volumes:
                - postgres_data:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres -d dmhub"]
                interval: 5s
                timeout: 5s
                retries: 10
                start_period: 30s

            backend:
              build:
                context: ./backend
              image: elohim-backend:ci
              depends_on:
                db:
                  condition: service_healthy
              environment:
                ASPNETCORE_ENVIRONMENT: Development
                ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=dmhub;Username=postgres;Password=postgres"
                DB_HOST: db
                DB_USER: postgres
                DB_PASSWORD: postgres
                DB_NAME: dmhub
                SEED_DATA: true
                SEED_USER_EMAIL: admin1@test.com
                SEED_USER_PASSWORD: 123456789
              ports:
                - "5000:5000"

          volumes:
            postgres_data:
          YAML
          docker compose -f compose.backend.ci.yml config --quiet

      - name: Build and start backend only
        run: |
          cd "$GITHUB_WORKSPACE/stack"
          docker compose -f compose.backend.ci.yml up -d --build --wait --wait-timeout 300

      - name: Verify backend HTTP availability
        run: |
          cd "$GITHUB_WORKSPACE/stack"
          curl --insecure --fail --silent --show-error --location \
            --retry 30 --retry-all-errors --retry-delay 5 \
            --connect-timeout 5 --max-time 20 "http://localhost:5000/swagger/v1/swagger.json" --output /dev/null
          for service in db backend; do
            container="$(docker compose -f compose.backend.ci.yml ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Running}}' "$container")" = true
            test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
          done

      - name: Run Bruno Integration and Regression Tests
        run: |
          cd "$GITHUB_WORKSPACE/stack/tests/bruno"
          npx -y @usebruno/cli run -r \
            --env ci \
            --reporter-junit "${RUNNER_TEMP}/results-bruno.xml" \
            --reporter-html "${RUNNER_TEMP}/results-bruno.html"

      - name: Upload Bruno test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bruno-test-results
          path: |
            ${{ runner.temp }}/results-bruno.xml
            ${{ runner.temp }}/results-bruno.html
          if-no-files-found: warn

      - name: Show backend container status and logs
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/stack"
          if [ -f compose.backend.ci.yml ]; then
            docker compose -f compose.backend.ci.yml ps -a
            docker compose -f compose.backend.ci.yml logs --no-color --tail=200
          fi

      - name: Clean up backend containers and volumes
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/stack"
          if [ -f compose.backend.ci.yml ]; then
            docker compose -f compose.backend.ci.yml down --volumes --remove-orphans
          fi
