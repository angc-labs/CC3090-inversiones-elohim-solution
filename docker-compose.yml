services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dmhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dmhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME:-dmhub};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}"
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dmhub}
      SEED_DATA: ${SEED_DATA:-${SEED_DEMO_DATA:-true}}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dmhub.fun}
        BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:5000}
        NEXT_PUBLIC_MAIN_DOMAIN: ${NEXT_PUBLIC_MAIN_DOMAIN:-dmhub.fun}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://dmhub.fun}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:5000}
      NEXT_PUBLIC_MAIN_DOMAIN: ${NEXT_PUBLIC_MAIN_DOMAIN:-dmhub.fun}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

  docs:
    build:
      context: ./docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-3001}:3001"
    volumes:
      - ./docs:/app
      - /app/node_modules

  nginx:
    profiles: ["production"]
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8085}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    entrypoint: >
      /bin/sh -c '
      mkdir -p /etc/letsencrypt/live/dmhub.fun /var/www/certbot;
      if [ ! -f /etc/letsencrypt/live/dmhub.fun/fullchain.pem ] || [ ! -f /etc/letsencrypt/live/dmhub.fun/privkey.pem ]; then
        echo "==> Generando certificado SSL autofirmado de respaldo para Nginx...";
        apk add --no-cache openssl >/dev/null 2>&1 || true;
        openssl req -x509 -nodes -newkey rsa:2048 -days 365 \
          -keyout /etc/letsencrypt/live/dmhub.fun/privkey.pem \
          -out /etc/letsencrypt/live/dmhub.fun/fullchain.pem \
          -subj "/CN=dmhub.fun" 2>/dev/null || true;
      fi;
      exec nginx -g "daemon off;"
      '
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - frontend
      - backend
      - docs

volumes:
  postgres_data:
    name: dmhub_postgres_data
