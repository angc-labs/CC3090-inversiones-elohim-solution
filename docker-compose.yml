services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dmhub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${DB_NAME:-dmhub};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}"
      DB_HOST: db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-dmhub}
      SEED_DATA: ${SEED_DATA:-${SEED_DEMO_DATA:-true}}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-admin@dmhub.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-Admin123!}

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:5000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      BACKEND_API_URL: ${BACKEND_API_URL:-http://backend:5000}

  docs:
    build:
      context: ./docs
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./docs:/app
      - /app/node_modules

volumes:
  postgres_data:
    name: dmhub_postgres_data